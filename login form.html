<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Shop Slider</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
        }
        .slider-container {
            max-width: 1200px;
            margin: auto;
            overflow: hidden;
            position: relative;
        }
        .slider-track {
            display: flex;
            transition: transform 0.5s ease;
        }
        .slider-item {
            min-width: calc(100% / 6);
            box-sizing: border-box;
            padding: 10px;
        }
        .slider-item img {
            width: 100%;
            border-radius: 10px;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.1);
        }
        .caption {
            text-align: center;
            margin-top: 10px;
            font-size: 16px;
        }
        .arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            font-size: 24px;
            cursor: pointer;
            background-color: rgba(0, 0, 0, 0.3);
            color: white;
            border-radius: 50%;
            padding: 10px;
        }
        .arrow-left {
            left: 10px;
        }
        .arrow-right {
            right: 10px;
        }
    </style>
</head>
<body>

    <h1>Instagram Shop</h1>
    <p>Tag @miniture in your Instagram photos for a chance to be featured here.</p>

    <div class="slider-container">
        <div class="slider-track">
            <div class="slider-item">
                <img src="https://via.placeholder.com/200" alt="Item 1">
                <div class="caption">📷</div>
            </div>
            <div class="slider-item">
                <img src="https://via.placeholder.com/200" alt="Item 2">
                <div class="caption">📷</div>
            </div>
            <div class="slider-item">
                <img src="https://via.placeholder.com/200" alt="Item 3">
                <div class="caption">📷</div>
            </div>
            <div class="slider-item">
                <img src="https://via.placeholder.com/200" alt="Item 4">
                <div class="caption">📷</div>
            </div>
            <div class="slider-item">
                <img src="https://via.placeholder.com/200" alt="Item 5">
                <div class="caption">📷</div>
            </div>
            <div class="slider-item">
                <img src="https://via.placeholder.com/200" alt="Item 6">
                <div class="caption">📷</div>
            </div>
            <div class="slider-item">
                <img src="https://via.placeholder.com/200" alt="Item 6">
                <div class="caption">📷</div>
            </div>
            <!-- Add more items if you want -->
        </div>
        <div class="arrow arrow-left" onclick="prevSlide()">&#10094;</div>
        <div class="arrow arrow-right" onclick="nextSlide()">&#10095;</div>
    </div>

    <script>
        const sliderTrack = document.querySelector('.slider-track');
        const sliderItems = document.querySelectorAll('.slider-item');
        const itemsToShow = 6; // Number of items to display at a time
        const itemWidth = sliderItems[0].offsetWidth; // Width of one item
        let currentIndex = 0;

        function updateSliderPosition() {
            const offset = currentIndex * itemWidth;
            sliderTrack.style.transform = `translateX(-${offset}px)`;
        }

        function nextSlide() {
            if (currentIndex < sliderItems.length - itemsToShow) {
                currentIndex++;
            } else {
                currentIndex = 0; // Loop back to the beginning
            }
            updateSliderPosition();
        }

        function prevSlide() {
            if (currentIndex > 0) {
                currentIndex--;
            } else {
                currentIndex = sliderItems.length - itemsToShow; // Go to the last set of items
            }
            updateSliderPosition();
        }

        // Auto-slide functionality (optional)
        setInterval(nextSlide, 5000); // Slide every 5 seconds
    </script>
</body>
</html>
