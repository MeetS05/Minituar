<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/OwlCarousel2/2.3.4/assets/owl.carousel.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/OwlCarousel2/2.3.4/assets/owl.theme.default.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/OwlCarousel2/2.3.4/owl.carousel.min.js"></script>
    <style>
        .slider-container {
            width: 100%;
            max-width: 800px;
            margin: auto;
        }

        .caption {
            text-align: center;
            font-size: 1.5rem;
        }

        .owl-nav button {
            background: transparent;
            border: none;
            font-size: 2rem;
            color: black;
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
        }

        .owl-nav .owl-prev {
            left: -50px; /* Adjust as necessary */
        }

        .owl-nav .owl-next {
            right: -50px; /* Adjust as necessary */
        }
    </style>
</head>
<body>
    <div class="slider-container">
        <div class="container">
            <h1>Instagram Shop</h1>
            <p>Tag @miniture in your Instagram photos for a chance to be featured here.</p>
            <div class="owl-carousel owl-theme">
                <div class="item">
                    <img src="../minituar/Assets/image/home_v5_img/post1.jpg" alt="Item 1">
                    <div class="caption">📷</div>
                </div>
                <div class="item">
                    <img src="../minituar/Assets/image/home_v5_img/post2.jpg" alt="Item 2">
                    <div class="caption">📷</div>
                </div>
                <div class="item">
                    <img src="../minituar/Assets/image/home_v5_img/post3.jpg" alt="Item 3">
                    <div class="caption">📷</div>
                </div>
                <div class="item">
                    <img src="../minituar/Assets/image/home_v5_img/post4.jpg" alt="Item 4">
                    <div class="caption">📷</div>
                </div>
                <div class="item">
                    <img src="../minituar/Assets/image/home_v5_img/post5.jpg" alt="Item 5">
                    <div class="caption">📷</div>
                </div>
                <div class="item">
                    <img src="../minituar/Assets/image/home_v5_img/post6.jpeg" alt="Item 6">
                    <div class="caption">📷</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        $(document).ready(function(){
            $('.owl-carousel').owlCarousel({
                loop: true,
                margin: 10,
                nav: true,
                autoplay: true,
                autoplayTimeout: 5000,
                responsive: {
                    0: {
                        items: 1
                    },
                    600: {
                        items: 3
                    },
                    1000: {
                        items: 6 // Display 6 items on larger screens
                    }
                }
            });
        });
    </script>
</body>
</html>
